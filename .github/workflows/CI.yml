name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # JACC's Julia 1.12 Threads path is currently stable with one thread.
      JULIA_NUM_THREADS: 1
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Full serial test suite without MPI or Enzyme
        env:
          JULIA_LOAD_PATH: "@:@stdlib"
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.develop(path=pwd())
            Pkg.add(["JACC", "StaticArrays", "Test"])
            @assert Base.find_package("Enzyme") === nothing
            @assert Base.find_package("MPI") === nothing
            using LatticeMatrices
            @assert Base.get_extension(
              LatticeMatrices, :LatticeMatricesEnzymeExt) === nothing
            @assert Base.get_extension(
              LatticeMatrices, :LatticeMatricesMPIExt) === nothing
            @eval LatticeMatrices.JACC.@init_backend
            lattice = LatticeMatrix(
              2, 2, 2, (4, 4), (1, 1); nw=1, device_mapping=:current)
            @assert lattice.comm isa SerialCommunicator
            lattice.A .= 1
            mark_halo_dirty!(lattice)
            set_halo!(lattice)
            @assert !halo_is_dirty(lattice)
            @assert mpi_transport_info(lattice).mpi_library === nothing
            @assert mpi_transport_info(lattice).resolved === :local
            ENV["LATTICEMATRICES_TEST_MPI"] = "false"
            include(joinpath(pwd(), "test", "runtests.jl"))
          '
      - uses: julia-actions/julia-buildpkg@v1
      - name: Fast CPU test suite
        uses: julia-actions/julia-runtest@v1
      - name: MPI initialization guard and explicit serial selection
        if: matrix.version != 'pre'
        run: |
          julia --project=. --startup-file=no -e '
            using LatticeMatrices, MPI
            @assert !MPI.Initialized()
            error = try
              LatticeMatrix(
                1, 1, 1, (4,), (1,); device_mapping=:current)
              nothing
            catch caught
              caught
            end
            @assert error isa ArgumentError
            @assert occursin(
              "MPI must be initialized and not finalized", sprint(showerror, error))
            serial = LatticeMatrix(
              1, 1, 1, (4,), (1,);
              comm0=SerialCommunicator(), device_mapping=:current)
            @assert serial.comm isa SerialCommunicator
            @assert isempty(serial.buf)
            @assert isempty(serial.buf_host)
          '
      - name: MPI halo epoch regression (2 ranks)
        if: matrix.version != 'pre'
        run: |
          julia --project=. --startup-file=no -e '
            using MPI
            MPI.Initialized() || MPI.Init()
            using LatticeMatrices
            @assert Base.get_extension(
              LatticeMatrices, :LatticeMatricesMPIExt) !== nothing
            mpi_lattice = LatticeMatrix(
              1, 1, 1, (4,), (1,);
              comm0=MPI.COMM_SELF, device_mapping=:current)
            serial_lattice = LatticeMatrix(
              1, 1, 1, (4,), (1,);
              comm0=SerialCommunicator(), device_mapping=:current)
            @assert mpi_lattice.comm === MPI.COMM_SELF
            @assert serial_lattice.comm isa SerialCommunicator
            @assert mpi_transport_info(serial_lattice).resolved === :local
            MPI.install_mpiexecjl(destdir=".ci-bin", force=true)
          '
          .ci-bin/mpiexecjl --project=. -n 2 \
            julia --project=. --startup-file=no test/mpi_halo.jl
      - name: README smoke test (2 ranks)
        if: matrix.version != 'pre'
        run: |
          .ci-bin/mpiexecjl --project=. -n 2 \
            julia --project=. --startup-file=no test/readmetest.jl
      - name: Prepare Enzyme smoke-test environment
        if: matrix.version != 'pre'
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(joinpath(pwd(), ".ci-ad-env"))
            Pkg.develop(path=pwd())
            Pkg.add(["Enzyme", "JACC"])
          '
      - name: Enzyme AD smoke tests without MPI
        if: matrix.version != 'pre'
        env:
          JULIA_LOAD_PATH: "@:@stdlib"
          LATTICEMATRICES_TEST_MPI: "false"
        run: |
          julia --project=.ci-ad-env --startup-file=no test/runtests_ad_ci.jl
      - name: Add MPI to Enzyme smoke-test environment
        if: matrix.version != 'pre'
        run: |
          julia --project=.ci-ad-env --startup-file=no -e '
            using Pkg
            Pkg.add("MPI")
          '
      - name: Enzyme AD smoke tests
        if: matrix.version != 'pre'
        run: |
          julia --project=.ci-ad-env --startup-file=no test/runtests_ad_ci.jl
      - name: MPI Enzyme gradient regression (2 ranks)
        if: matrix.version == '1.11'
        run: |
          .ci-bin/mpiexecjl --project=.ci-ad-env -n 2 \
            julia --project=.ci-ad-env --startup-file=no test/mpi_enzyme.jl
