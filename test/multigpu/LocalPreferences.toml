[JACC]
backend = "cuda"
default_backend = "cuda"
backends = ["cuda"]
placement = {cuda = "deps"}

[MPIPreferences]
__clear__ = ["preloads_env_switch"]
_format = "1.0"
abi = "OpenMPI"
binary = "system"
cclibs = []
libmpi = "/opt/ompi-cuda/lib/libmpi.so"
mpiexec = "/opt/ompi-cuda/bin/mpiexec"
preloads = []
